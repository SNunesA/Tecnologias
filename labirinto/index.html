<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Labirinto</title>
    <script src="js/funcoes.js" defer></script>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div id="controles">
     <select name="evento" id="evento">
         <option value="" disabled selected hidden>Evento</option>
         <option value="1">Ir para</option>
         <option value="2">Pular para</option>
     </select>
     <select name="direcao" id="direcao">
         <option value="" disabled selected hidden>Direção</option>
         <option value="1">Acima</option>
         <option value="2">Abaixo</option>
         <option value="3">Direita</option>
         <option value="4">Esquerda</option>
     </select>
     <input type="number" name="casas" id="casas" placeholder="Casas" style="width: 60px;">
    <button onclick="inserirComandos()" id="incluir">Incluir</button>
    <button onclick="seguirCaminho()" id="executar">Executar</button>
    <button  id="vizinho">Vizinhos</button>
    <button onclick="encontraCaminhoEstrela()">Estrela</button>
    
</div>
<div id="comandos"></div>
<div id="parabens"></div>
<div id="tabela"></div>
</body>
</html>
